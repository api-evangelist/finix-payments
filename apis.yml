aid: finix-payments
name: Finix Payments
description: >-
  Finix is a full-stack payments technology provider that lets businesses, software platforms, and
  marketplaces accept and send payments online and in person. Its REST API (version 2022-02-01) covers the
  full payments lifecycle — Identities, Merchants, Payment Instruments, Authorizations, Transfers,
  Settlements, Disputes, Verifications, Fee/Payout Profiles, Devices/terminals, and Webhooks — enabling
  card, ACH, EFT, digital-wallet, and Buy-Now-Pay-Later acceptance, seller onboarding/underwriting, split
  transfers, payouts, and payment facilitation (PayFac-as-a-service). Finix is a Level 1 PCI DSS certified
  platform with browser (finix.js) and mobile tokenization SDKs, hosted checkout pages, and payment links.
  Authentication is HTTP Basic Auth with environment-scoped API keys; the API uses cursor pagination,
  idempotency_id request-level idempotency, HAL responses, and dated versioning via the Finix-Version header.
