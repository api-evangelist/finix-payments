source: https://docs.finix.com/additional-resources/developers/webhooks/webhook-events
spec_type: Webhooks
note: >-
  Finix documents webhooks but does not publish an AsyncAPI document. This captures the webhook event
  catalog. Events are delivered as HTTP POST to subscribed endpoints; each event carries an entity + type.
  "default" indicates whether newly created webhooks subscribe to that event by default. Webhook delivery
  history is retained 30 days in the Dashboard. Managed via the Webhooks API (createWebhook/listWebhooks/
  getWebhook/updateWebhook).
transport: http-post
delivery_history_days: 30
management_api:
